# Categories for the release notes that `gh release create --generate-notes` writes.
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Breaking changes
      labels: [breaking-change]
    - title: Security
      labels: [security]
    - title: New features
      labels: [enhancement, feature]
    - title: Bug fixes
      labels: [bug, fix]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
